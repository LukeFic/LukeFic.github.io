<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>2017 Fuel Economy Narative Visualization</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style>
#cars2017 {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

body {
    font-family: Arial, sans-serif;
}
</style>
</head>

<body>

<h1 style="text-align:center;">
    2017 Vehicle Fuel Economy
</h1>
<p style="text-align:center; width:700px; margin:auto;">
    This visualization explores the relationship between differnet models and types of cars' city and highway fuel economy.
    Each point represents a vehicle configuration from the 2017 vehicle fleet.
</p>
<div id="cars2017"></div>

<!-- Adds next button -->
    <div style="text-align:center; margin-top:20px;">
    <button id="nextButton">Next</button>
</div>

<script>
let currentScene = 1;

//positions the svg in the correct spot
var margin = {top: 20, right: 60, bottom: 60, left: 120};
var width = 600 - margin.left - margin.right;
var height = 500 - margin.top - margin.bottom;
var svg = d3.select("#cars2017")
      .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
      .append("g")
    .attr("transform",
          "translate(" + margin.left + "," + margin.top + ")");

function drawScene(scene, data) { //switches between scenes; takes the scene number and data
    svg.selectAll("*").remove();
    if (scene == 1) {
        drawOverview(data);
    }
    if (scene == 2) {
        drawElectricVehicles(data);
    }
    if (scene == 3) {
        drawExplore(data);
    }
}    
    
//imports data
d3.csv("cars2017.csv").then(function(data) {        
data.forEach(function(d){
    d.AverageCityMPG = +d.AverageCityMPG;
    d.AverageHighwayMPG = +d.AverageHighwayMPG;
    });
    drawScene(currentScene, data);

    //functionality for next button    
    d3.select("#nextButton")
    .on("click", function(){
        currentScene++;
        if(currentScene > 3){
            currentScene = 1;
        }
        drawScene(currentScene, data);
    });
})

    
function drawOverview(data) {

  // adds X axis with grid lines
    var x = d3.scaleLinear()
    .domain([
        d3.min(data, function(d){
            return d.AverageCityMPG - 5;
        }),
        d3.max(data, function(d){
            return d.AverageCityMPG + 5;
        })
        ])
        .range([0,width]); 
      svg.append("g")
    .attr("transform", "translate(0," + height + ")")
    .attr("class", "grid x-grid")
    .call(d3.axisBottom(x)
        .tickSizeInner(-height));

  // add Y axis with grid lines
    var y = d3.scaleLinear()
    .domain([
        d3.min(data, function(d){
            return d.AverageHighwayMPG - 5;
        }),
        d3.max(data, function(d){
            return d.AverageHighwayMPG + 5;
        })
        ])
        .range([height,0]);
      svg.append("g")
    .attr("class", "grid x-grid")
    .call(d3.axisLeft(y)
        .tickSizeInner(-width));

   //sets grid line characteristics     
    svg.selectAll(".grid line")
    .attr("stroke", "#e0e0e0")
    .attr("stroke-opacity", 0.7);

  // populate data
    svg.append("g")
        .selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", function(d){
            return x(d.AverageCityMPG);
        })
        .attr("cy", function(d){
            return y(d.AverageHighwayMPG);
        })
        .attr("r",5)
        .style("fill","blue")
        .style("stroke", "black")
        .style("stroke-width", "2px")
        .style("opacity", 0.8);

    //adds axis titles
     svg.append("text")
        .attr("x",width/2)
        .attr("y",height+45)
        .style("text-anchor","middle")
        .text("Average City MPG");
    svg.append("text")
        .attr("transform","rotate(-90)")
        .attr("x",-height/2)
        .attr("y",-50)
        .style("text-anchor","middle")
        .text("Average Highway MPG");
    }

    //add text to scene
    svg.append("text")
    .attr("x", width/2)
    .attr("y", -5)
    .attr("text-anchor", "middle")
    .style("font-size", "18px")
    .style("font-weight", "bold")
    .text("Scene 1: Overall Fuel Economy");

    svg.append("text")
    .attr("x", width/2)
    .attr("y", 15)
    .attr("text-anchor", "middle")
    .style("font-size", "12px")
    .text("Each point represents one vehicle from 2017.");

function drawElectricVehicles(data) {

  // adds X axis with grid lines
    var x = d3.scaleLinear()
    .domain([
        d3.min(data, function(d){
            return d.AverageCityMPG - 5;
        }),
        d3.max(data, function(d){
            return d.AverageCityMPG + 5;
        })
        ])
        .range([0,width]); 
      svg.append("g")
    .attr("transform", "translate(0," + height + ")")
    .attr("class", "grid x-grid")
    .call(d3.axisBottom(x)
        .tickSizeInner(-height));

  // add Y axis with grid lines
    var y = d3.scaleLinear()
    .domain([
        d3.min(data, function(d){
            return d.AverageHighwayMPG - 5;
        }),
        d3.max(data, function(d){
            return d.AverageHighwayMPG + 5;
        })
        ])
        .range([height,0]);
      svg.append("g")
    .attr("class", "grid x-grid")
    .call(d3.axisLeft(y)
        .tickSizeInner(-width));

   //sets grid line characteristics     
    svg.selectAll(".grid line")
    .attr("stroke", "#e0e0e0")
    .attr("stroke-opacity", 0.7);

  // populate data
    svg.append("g")
        .selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", function(d){
            return x(d.AverageCityMPG);
        })
        .attr("cy", function(d){
            return y(d.AverageHighwayMPG);
        })
        .attr("r",5)
        .style("fill", function(d){
            if(d.Fuel == "Gasoline")
                return "steelblue";
            if(d.Fuel == "Diesel")
                return "orange";
            if(d.Fuel == "Electricity")
                return "green";
            return "gray";
        })
        .style("stroke", "black")
        .style("stroke-width", "2px")
        .style("opacity", 0.8);

    //adds axis titles
     svg.append("text")
        .attr("x",width/2)
        .attr("y",height+45)
        .style("text-anchor","middle")
        .text("Average City MPG");
    svg.append("text")
        .attr("transform","rotate(-90)")
        .attr("x",-height/2)
        .attr("y",-50)
        .style("text-anchor","middle")
        .text("Average Highway MPG");
    }

function drawExplore(data) {

  // adds X axis with grid lines
    var x = d3.scaleLinear()
    .domain([
        d3.min(data, function(d){
            return d.AverageCityMPG - 5;
        }),
        d3.max(data, function(d){
            return d.AverageCityMPG + 5;
        })
        ])
        .range([0,width]); 
      svg.append("g")
    .attr("transform", "translate(0," + height + ")")
    .attr("class", "grid x-grid")
    .call(d3.axisBottom(x)
        .tickSizeInner(-height));

  // add Y axis with grid lines
    var y = d3.scaleLinear()
    .domain([
        d3.min(data, function(d){
            return d.AverageHighwayMPG - 5;
        }),
        d3.max(data, function(d){
            return d.AverageHighwayMPG + 5;
        })
        ])
        .range([height,0]);
      svg.append("g")
    .attr("class", "grid x-grid")
    .call(d3.axisLeft(y)
        .tickSizeInner(-width));

   //sets grid line characteristics     
    svg.selectAll(".grid line")
    .attr("stroke", "#e0e0e0")
    .attr("stroke-opacity", 0.7);

  // populate data
    svg.append("g")
        .selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", function(d){
            return x(d.AverageCityMPG);
        })
        .attr("cy", function(d){
            return y(d.AverageHighwayMPG);
        })
        .attr("r",5)
        .style("fill", function(d){
            if(d.Fuel == "Gasoline")
                return "steelblue";
            if(d.Fuel == "Diesel")
                return "orange";
            if(d.Fuel == "Electricity")
                return "green";
            return "gray";
        })
        .style("stroke", "black")
        .style("stroke-width", "2px")
        .style("opacity", 0.8);

    //adds axis titles
     svg.append("text")
        .attr("x",width/2)
        .attr("y",height+45)
        .style("text-anchor","middle")
        .text("Average City MPG");
    svg.append("text")
        .attr("transform","rotate(-90)")
        .attr("x",-height/2)
        .attr("y",-50)
        .style("text-anchor","middle")
        .text("Average Highway MPG");
    }

    
</script>

</body>
</html>
